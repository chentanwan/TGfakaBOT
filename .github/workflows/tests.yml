name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tgfakabot_test
          POSTGRES_USER: tgfakabot
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tgfakabot -d tgfakabot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BOT_TOKEN: test-token
      ADMIN_IDS: "1"
      DATABASE_URL: postgresql+asyncpg://tgfakabot:test-password@127.0.0.1:5432/tgfakabot_test
      TEST_DATABASE_URL: postgresql+asyncpg://tgfakabot:test-password@127.0.0.1:5432/tgfakabot_test
      REDIS_URL: redis://127.0.0.1:6379/15
      RUN_INTEGRATION: "1"
      CARD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CARD_FINGERPRINT_KEY: github-actions-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check app tests migrations
      - run: pytest -q
